name: Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  plugin:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install tested Codex CLI
      run: npm install --global @openai/codex@0.162.1 --no-audit --no-fund
    - name: Verify plugin installation and skill upgrade
      shell: pwsh
      run: |
        $cli = Join-Path (npm root --global) '@openai/codex/bin/codex.js'
        python ./scripts/test-plugin.py --codex-cli $cli

  compile:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.3

    - name: Build native bootstrapper (x86 and x64)
      shell: pwsh
      run: ./scripts/Build-NativeBootstrapper.ps1

    - name: Cache NuGet dependencies
      uses: ./.github/actions/nuget-cache

    - name: Restore dependencies
      run: dotnet restore WpfVisualTreeMcp.sln

    - name: Build
      run: dotnet build WpfVisualTreeMcp.sln --no-restore --configuration Release

    - name: Test
      run: dotnet test WpfVisualTreeMcp.sln --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx"

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: '**/TestResults/*.trx'

    - name: Publish MCP Server
      run: dotnet publish src/WpfVisualTreeMcp.Server/WpfVisualTreeMcp.Server.csproj --no-build --configuration Release --output ./publish

    - name: Pack C# automation SDK
      run: dotnet pack src/WpfVisualTreeMcp.Automation/WpfVisualTreeMcp.Automation.csproj --no-build --configuration Release --output ./artifacts/packages

    - name: Upload C# automation SDK
      uses: actions/upload-artifact@v4
      with:
        name: wpf-automation-nuget
        path: ./artifacts/packages/*.nupkg

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: wpf-visual-tree-mcp
        path: ./publish
        include-hidden-files: true

  compatibility:
    needs: compile
    uses: ./.github/workflows/compatibility.yml
    with:
      server-artifact: wpf-visual-tree-mcp
      packages-artifact: wpf-automation-nuget

  # Preserve the original required check name: success still means all tests passed.
  build:
    if: always()
    needs: [compile, compatibility]
    runs-on: ubuntu-latest
    steps:
    - name: Require successful build and compatibility tests
      env:
        COMPILE_RESULT: ${{ needs.compile.result }}
        COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
      run: test "$COMPILE_RESULT" = success && test "$COMPATIBILITY_RESULT" = success

  code-quality:
    runs-on: ubuntu-latest
    env:
      EnableWindowsTargeting: 'true'

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Cache NuGet dependencies
      uses: ./.github/actions/nuget-cache

    - name: Restore dependencies
      # Enables Windows references for restore and format on Linux.
      run: dotnet restore src/WpfVisualTreeMcp.Server/WpfVisualTreeMcp.Server.csproj -p:EnableWindowsTargeting=true

    - name: Check formatting
      run: dotnet format src/WpfVisualTreeMcp.Server/WpfVisualTreeMcp.Server.csproj --no-restore --verify-no-changes --verbosity diagnostic
      continue-on-error: true

  # Build verification for .NET Framework projects (Windows only)
  build-netfx:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.3

    - name: Cache NuGet dependencies
      uses: ./.github/actions/nuget-cache

    - name: Restore NuGet packages
      run: dotnet restore WpfVisualTreeMcp.sln

    - name: Build .NET Framework projects
      run: |
        dotnet build src/WpfVisualTreeMcp.Inspector/WpfVisualTreeMcp.Inspector.csproj --configuration Release
        dotnet build src/WpfVisualTreeMcp.Injector/WpfVisualTreeMcp.Injector.csproj --configuration Release
        dotnet build samples/SampleWpfApp/SampleWpfApp.csproj --configuration Release
